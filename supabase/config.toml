# Local Supabase stack for development and CI (`supabase start`). The hosted project uses the same
# migrations (supabase/migrations) and seed (supabase/seed/demo_accounts.sql).
project_id = "baton"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/demo_accounts.sql"]

[auth]
enabled = true
site_url = "http://localhost:3200"
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[studio]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
